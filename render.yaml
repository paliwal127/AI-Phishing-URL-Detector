services:
  - type: web
    name: signalguard-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /admin/login/
    disk:
      name: signalguard-model
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-project.vercel.app
      - key: PHISHING_MODEL_PATH
        value: /var/data/phishing_rf.joblib
      - key: DATABASE_URL
        fromDatabase:
          name: signalguard-db
          property: connectionString

databases:
  - name: signalguard-db
    plan: basic-256mb
